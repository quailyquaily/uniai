# Example pricing catalog for uniai.
#
# Refreshed on 2026-09-21: DeepSeek V4.1 Flash rates and legacy aliases,
# GLM-5.3-Flash standard rates, GLM-5.3-FlashX, and GPT Image 2.5.
# Previous refresh on 2026-09-06 from official pricing and model documentation:
# - OpenAI GPT-6 Astra, GPT-5.6 Sol promotional rates, GPT-5.4/5.5 context
#   thresholds, and GPT Image 1.5 text output.
# - Claude Fable/Mythos 5.1 and Sonnet 5 permanent pricing.
# - Gemini 3.8 Flash, GLM-5.3 / 5.3-Flash, MiniMax M3, Kimi K2.7 Code,
#   DeepSeek V4 Flash Vision Exp, Mistral Medium 3.5, and Sakana models.
# - Cloudflare-hosted DeepSeek V4, GLM-5.3 / 5.3-Flash, and Kimi K2.7 Code.
# Earlier checks:
# Checked against official pricing pages on 2026-05-20.
# OpenAI, xAI, and Anthropic entries refreshed on 2026-07-10 from official
# pricing and model docs.
# Moonshot Kimi entries refreshed on 2026-07-26 for Kimi K3 launch.
# OpenAI GPT-5.6, GPT-5.5 long-context / pro, and GPT Image 1.5 / 1-mini
# pricing added on 2026-07-10 from the public pricing page.
# Claude Opus 4.8 standard rates added on 2026-05-29 from the public pricing page.
# Claude Fable 5 and Mythos 5 standard rates added on 2026-06-10 from the
# public pricing page.
# Claude Opus 5 standard rates added on 2026-07-25 from the public model docs.
# Claude Sonnet 5 introductory rates added on 2026-07-10 from the public
# pricing page.
# DeepSeek V4-Flash-0731 and V4-Pro-0813 peak/off-peak rates refreshed on
# 2026-08-15 from the public pricing page and change log.
# xAI Grok 4.5 and Grok 4.20 Multi-Agent entries added on 2026-07-10 from the
# official docs pages.
# xAI Grok 4.6 pricing added on 2026-08-15 from the official docs pages.
# Meta Muse Spark 1.1 pricing added on 2026-07-10 from public launch reporting;
# Meta's developer pricing page required login at the time checked.
# OpenAI GPT Image 2 image-generation pricing added on 2026-05-13 from the
# public pricing page.
# OpenAI GPT Image 1 pricing added on 2026-05-14 from the public pricing page.
# Gemini image-generation model IDs and modality-specific output rates refreshed
# on 2026-08-24 from the public pricing and deprecation pages.
# Gemini 3.5 Flash pricing added on 2026-05-20 from the public pricing page.
# Gemini 3.7 Flash and 3.6 Flash introductory pricing, and Gemini 3.5
# Flash-Lite pricing, added on 2026-08-17 from the public pricing page.
# Z.AI GLM-5.2 and GLM-5.1 pricing added on 2026-08-17 from the public pricing
# page.
# Sakana Fugu Ultra pricing added on 2026-06-22 from the public pricing page.
# Prices may change later. Re-check the official pages before using this in production.
#
# This example includes chat token rates and image-generation token rates that
# fit the current PricingCatalog schema.
# It does not encode:
# - Batch / Flex / Priority / fast-mode variants
# - tool invocation fees
# - storage fees for cache/context caching
# - audio specific token prices
#
# Sources used for this file:
# - OpenAI: https://developers.openai.com/api/docs/pricing
# - OpenAI GPT-6 Astra: https://developers.openai.com/api/docs/models/gpt-6-astra
# - OpenAI GPT Image 2.5: https://developers.openai.com/api/docs/models/gpt-image-2.5-sunburst
# - OpenAI GPT Image 2.5 Flare: https://developers.openai.com/api/docs/models/gpt-image-2.5-flare
# - OpenAI GPT-5.4: https://developers.openai.com/api/docs/models/gpt-5.4
# - OpenAI GPT-5.5: https://developers.openai.com/api/docs/models/gpt-5.5
# - OpenAI GPT-5.6 Sol: https://developers.openai.com/api/docs/models/gpt-5.6-sol
# - Anthropic: https://platform.claude.com/docs/en/about-claude/pricing
# - Anthropic Claude Fable 5.1: https://platform.claude.com/docs/en/models/overview
# - Anthropic Claude Mythos 5.1: https://platform.claude.com/docs/en/models/mythos-5-1/overview
# - Anthropic Claude Opus 5: https://platform.claude.com/docs/en/about-claude/models/whats-new-opus-5
# - Anthropic Claude Opus 4.8: https://www.anthropic.com/news/claude-opus-4-8
# - Anthropic model IDs: https://platform.claude.com/docs/en/about-claude/models/overview
# - Gemini: https://ai.google.dev/gemini-api/docs/pricing
# - Mistral: https://mistral.ai/pricing
# - Mistral token rates: https://docs.mistral.ai/inference/pricing
# - Mistral Medium 3.5: https://docs.mistral.ai/models/mistral-medium-3-5-26-04
# - Mistral models: https://docs.mistral.ai/getting-started/models
# - Cohere: https://docs.cohere.com/docs/how-does-cohere-pricing-work
# - Z.AI: https://docs.z.ai/guides/overview/pricing
# - Moonshot Kimi: https://platform.kimi.ai/docs/pricing/chat
# - Moonshot Kimi K3: https://platform.kimi.ai/docs/pricing/chat-k3
# - Moonshot Kimi K2.7 Code: https://platform.kimi.ai/docs/pricing/chat-k27-code
# - MiniMax: https://platform.minimax.io/docs/guides/pricing-paygo
# - DeepSeek: https://api-docs.deepseek.com/quick_start/pricing/
# - DeepSeek change log: https://api-docs.deepseek.com/updates/
# - xAI: https://docs.x.ai/developers/models
# - xAI pricing: https://docs.x.ai/developers/pricing
# - xAI Grok 4.5: https://docs.x.ai/developers/grok-4-5
# - xAI Grok 4.3 detail: https://docs.x.ai/developers/models/grok-4.3
# - xAI Grok 4.20 Multi-Agent detail: https://docs.x.ai/developers/models/grok-4.20-multi-agent-0309
# - Groq: https://console.groq.com/docs/models
# - Groq GPT-OSS cached pricing: https://console.groq.com/docs/model/openai/gpt-oss-120b
# - Meta Muse Spark 1.1 launch: https://ai.meta.com/blog/introducing-muse-spark-meta-model-api/
# - Meta Muse Spark 1.1 pricing reports:
#   https://www.businessinsider.com/meta-launches-muse-spark-1-1-cost-effective-ai-2026-7
#   https://www.barrons.com/articles/meta-stock-ai-model-cd81befb
# - Cloudflare: https://developers.cloudflare.com/workers-ai/platform/pricing/
# - Sakana AI: https://console.sakana.ai/pricing
#
# Notes:
# - This example includes GPT-6 / GPT-5.6 / GPT-5.5 / GPT-5.4 / GPT-5.2 / GPT-5 /
#   GPT-4o text pricing, including long-context tiers where applicable.
# - OpenAI `gpt-5.6` is an alias for `gpt-5.6-sol` per the model guidance page.
#   GPT-6 and GPT-5.6 cache writes use `cache_creation_input_usd_per_million`.
# - GPT-5.6 Sol promotional rates apply at least through 2026-11-21.
# - Anthropic cache prices below are derived from Anthropic's published prompt-caching multipliers:
#   cache read = 0.1x input, 5m cache write = 1.25x input, 1h cache write = 2x input.
#   Fable 5.1 and Mythos 5.1 instead use 0.025x input for cache reads.
# - Claude Opus 4.8 uses standard pricing across its full 1M token context window.
# - Claude Sonnet 5 keeps $2/$10 per MTok as its standard price; the previously
#   announced 2026-09-01 increase was cancelled.
# - Kimi K3 uses flat pricing across its full 1M token context window.
# - OpenAI GPT-6 Astra and the tiered GPT-5.6 / GPT-5.5 / GPT-5.4 rules below
#   use `>272000` input tokens for long-context pricing.
# - MiniMax M3 uses `>512000` input tokens for higher-context pricing. Rates
#   include the permanent 50% discount; no cache-write rate is published.
# - Gemini `gemini-3-pro-preview` and `gemini-2.5-pro` long-context tiers below use
#   `>200000` input tokens.
# - Gemini 3.8 Flash, 3.7 Flash, and 3.6 Flash use introductory prices through
#   2026-12-31. Standard $1.50 input, $0.15 cached-input, and $7.50 output rates
#   start on 2027-01-01.
# - xAI `grok-4.6` and `grok-4.5` higher-context pricing below starts at
#   `>=200000` input tokens.
# - xAI `grok-4.3` higher-context pricing below uses `>200000` input tokens.
# - Sakana Fugu Ultra higher-context pricing below uses `>272000`
#   input tokens. The `fugu` model is not listed because Sakana prices it by
#   the selected underlying model.
# - Gemini Flash entries below use the text / image / video tier.
# - Runtime price lookup matches by `model` / `aliases` by default, not by the
#   client's driver/provider name. Callers can optionally pass an explicit
#   `inference_provider` hint. If that provider exists in the catalog, matching
#   stays within that provider. Otherwise lookup falls back to model-only matching.
# - DeepSeek `deepseek-flash` serves V4.1 Flash. Legacy `deepseek-v4-flash`
#   and `deepseek-v4-flash-vision-exp` route to it at the same rates.
#   `deepseek-v4-pro` serves V4-Pro-0813. The retired
#   `deepseek-chat` and `deepseek-reasoner` model names are not pricing aliases.
# - Direct DeepSeek flat fields contain off-peak rates and `peak_rates` contains peak
#   rates. Callers decide which rate set applies.
# - GLM-5.3-Flash uses standard input/cached/output rates of $0.15/$0.03/$0.50
#   per MTok. Its 50% promotion ended on 2026-09-09 24:00 UTC+8.
# - Promotional prices are a static snapshot; they do not expire automatically.
# - Mistral aliases below follow explicit mappings in the official model docs.
# - OpenAI image generation pricing uses separate rates for text input, image
#   input, cached input, and image output tokens where published.
# - Image-generation rules use separate text and image output rates where
#   published, at the Standard tier.

# Informational metadata for humans. ParsePricingYAML ignores unknown top-level
# fields, so this section does not affect runtime pricing lookup.
